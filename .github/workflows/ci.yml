name: MenuFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, automation/ci-pipeline]

permissions:
  contents: read

concurrency:
  group: menuflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Security Tests, TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Install Functions dependencies for emulator integration tests
        run: npm ci --prefix functions
      - name: Check diff formatting
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
      - name: Lint
        run: npm run lint
      - name: Full automated regression suite
        run: npm test
      - name: TypeScript & production build
        run: npm run build

  functions:
    name: Firebase Functions Node 20 validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
      - name: Validate Functions syntax
        run: node --check index.js
