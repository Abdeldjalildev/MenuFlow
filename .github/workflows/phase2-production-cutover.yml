name: Phase 2 Production Rules Cutover

on:
  workflow_dispatch:
    inputs:
      restaurant_id:
        description: 'Production restaurant ID used for the canary verification'
        required: true
        type: string

permissions:
  contents: read

jobs:
  cutover-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.2
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy trusted-claims function
        run: firebase deploy --only functions:provisionAuthzClaims --project menuflow-c02e5 --non-interactive
      - name: Deploy production Firestore rules
        run: firebase deploy --only firestore:rules --project menuflow-c02e5 --non-interactive
      - name: Verify production customer boundary
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_RESTAURANT_ID: ${{ inputs.restaurant_id }}
        run: npm run test:phase2:production
